server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Tarayıcı sadece bu adresle konuşur; /api istekleri compose ağındaki "api" servisine gider.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router: bilinmeyen yolları index.html'e düşür
    location / {
        try_files $uri /index.html;
    }
}
